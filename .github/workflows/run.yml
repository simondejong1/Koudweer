YAML

name: Draai mijn script elk uur

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakketten installeren (indien nodig)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Script uitvoeren
        run: python jouw_script_naam.py
